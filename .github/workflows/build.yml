name: Auto build upstream image

on:
  schedule:
    # 每 6 小时检查一次上游新版本（避开整点高峰）
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  UPSTREAM_REPO: fuzhengwei/WaLiAPI
  IMAGE_NAME: jackview/waliapi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout image repo
        uses: actions/checkout@v4

      - name: Get upstream latest version
        id: upstream
        run: |
          VER=$(curl -sf "https://api.github.com/repos/${UPSTREAM_REPO}/tags?per_page=20" \
            | grep -oP '"name":\s*"waliapi-v\K[0-9.]+' | head -1)
          if [ -z "$VER" ]; then
            echo "::error::Failed to get upstream latest version"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Upstream latest version: $VER"

      - name: Compare with last built
        id: check
        run: |
          LAST=$(cat .last-built-version 2>/dev/null || echo none)
          if [ "$LAST" = "${{ steps.upstream.outputs.version }}" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Already built: $LAST, skip"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "New version detected: $LAST -> ${{ steps.upstream.outputs.version }}"
          fi

      - name: Checkout upstream source at tag
        if: steps.check.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: waliapi-v${{ steps.upstream.outputs.version }}
          path: upstream

      - name: Set up Docker Buildx
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.check.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:v${{ steps.upstream.outputs.version }}

      - name: Update version record and push
        if: steps.check.outputs.build == 'true'
        run: |
          echo "${{ steps.upstream.outputs.version }}" > .last-built-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-built-version
          git commit -m "build: upstream v${{ steps.upstream.outputs.version }}"
          git push
